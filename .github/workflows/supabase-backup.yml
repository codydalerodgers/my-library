name: Supabase DB Backup

on:
  schedule:
    # Every day at 03:00 UTC – adjust as you like
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Supabase auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Create backup directory
        run: mkdir -p backups

      - name: Dump database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          # Supabase-managed Postgres URL (no username/db name changes)
          DB_URL="postgres://postgres:${SUPABASE_DB_PASSWORD}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres"
          supabase db dump \
            --db-url "$DB_URL" \
            --data-only \
            --file "backups/db-${TIMESTAMP}.sql"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-backup
          path: backups/
          retention-days: 14
